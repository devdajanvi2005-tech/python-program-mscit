<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Task</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            padding: 30px 15px;
        }

        .box {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
        }

        input, textarea, select, button {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }

        a {
            display: inline-block;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="box">
        <h2>Edit Task</h2>

        <form action="/update/{{ task.id }}" method="post">

            <label>Task Title</label>
            <input
                type="text"
                name="title"
                value="{{ task.title }}"
                maxlength="150"
                required
            >

            <label>Description</label>
            <textarea
                name="description"
                maxlength="300"
            >{{ task.description or '' }}</textarea>

            <label>Priority</label>
            <select name="priority">
                <option value="High"
                    {% if task.priority == 'High' %}selected{% endif %}>
                    High
                </option>

                <option value="Medium"
                    {% if task.priority == 'Medium' %}selected{% endif %}>
                    Medium
                </option>

                <option value="Low"
                    {% if task.priority == 'Low' %}selected{% endif %}>
                    Low
                </option>
            </select>

            <button type="submit">Update Task</button>
        </form>

        <a href="/">Back to Home</a>
    </div>
</body>
</html>
