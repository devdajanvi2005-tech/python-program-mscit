<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Personal Task Tracker - Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            text-align: center;
            padding: 60px 15px;
        }

        .box {
            background: white;
            max-width: 350px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ccc;
        }

        input, button {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Personal Task Tracker</h2>
        <p>Enter your name to continue</p>

        <form action="/login" method="post">
            <input
                type="text"
                name="username"
                placeholder="Enter your name"
                maxlength="100"
                required
            >
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
